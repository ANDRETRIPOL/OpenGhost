name: Build

# Builds the macOS and Linux apps from a release branch and keeps them as workflow artifacts.
# Nothing is published: the files go into a release only by hand.
on:
  push:
    branches: ['release-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Build
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Verify and test the packaged app
        run: |
          app=$(find dist -name 'OpenGhost.app' -type d | head -1)
          node .github/checks/verify-package.js "$app/Contents/Resources/app.asar"
          APP_EXEC="$app/Contents/MacOS/OpenGhost" OUT="$RUNNER_TEMP/mac-smoke" node .github/checks/release-smoke.js
      - uses: actions/upload-artifact@v4
        with:
          name: OpenGhost-mac
          path: dist/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-smoke
          path: |
            ${{ runner.temp }}/mac-smoke/*.png
            ${{ runner.temp }}/mac-smoke/report.json
            ${{ runner.temp }}/mac-smoke/app.log
            dist/package-verification.json
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Build
        run: npm run dist:linux
      - name: Verify and test the packaged app
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          node .github/checks/verify-package.js dist/linux-unpacked/resources/app.asar
          APP_EXEC="$PWD/dist/linux-unpacked/openghost" OUT="$RUNNER_TEMP/linux-smoke" xvfb-run -a -s '-screen 0 1440x900x24' node .github/checks/release-smoke.js
      - uses: actions/upload-artifact@v4
        with:
          name: OpenGhost-linux
          path: dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-smoke
          path: |
            ${{ runner.temp }}/linux-smoke/*.png
            ${{ runner.temp }}/linux-smoke/report.json
            ${{ runner.temp }}/linux-smoke/app.log
            dist/package-verification.json
          if-no-files-found: ignore
