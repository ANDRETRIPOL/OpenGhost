name: Thinking probe

# Asks real local servers how they tell of a model's thinking and how they take a request to think more, less or not
# at all. Only reads and prints: nothing of the app is run. Started by hand.
on:
  workflow_dispatch:

jobs:
  ollama:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ollama with thinking models
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -s -m 3 http://127.0.0.1:11434/api/version; then (nohup ollama serve > ollama.log 2>&1 &); fi
          for i in $(seq 1 30); do curl -s -m 2 http://127.0.0.1:11434/api/version && break; sleep 1; done
          for m in qwen3:1.7b deepseek-r1:1.5b qwen2.5:1.5b; do ollama pull $m > /dev/null 2>&1; done
          ollama list
      - name: What /api/show says of thinking
        run: |
          for m in qwen3:1.7b deepseek-r1:1.5b qwen2.5:1.5b; do
            echo "== $m"
            curl -s http://127.0.0.1:11434/api/show -d "{\"model\":\"$m\"}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps({'capabilities': d.get('capabilities'), 'thinking': d.get('thinking', 'ABSENT'), 'keys': sorted(d.keys())}))"
          done
          echo "== /api/tags entries"
          curl -s http://127.0.0.1:11434/api/tags | python3 -c "import sys,json; [print(json.dumps({k: m.get(k) for k in ('name','capabilities','thinking')})) for m in json.load(sys.stdin)['models']]"
      - name: How /api/chat takes think
        run: |
          ask() { curl -s http://127.0.0.1:11434/api/chat -d "$1" | python3 -c "import sys,json; d=json.load(sys.stdin); m=d.get('message',{}); print(json.dumps({'error': d.get('error'), 'thinking_chars': len(m.get('thinking') or ''), 'content': (m.get('content') or '')[:90], 'has_think_tag': '<think>' in (m.get('content') or '')}))"; }
          Q='"messages":[{"role":"user","content":"What is 17 times 23? Answer with the number."}],"stream":false,"options":{"num_predict":400}'
          for m in qwen3:1.7b deepseek-r1:1.5b; do
            echo "== $m, think not sent";    ask "{\"model\":\"$m\",$Q}"
            echo "== $m, think false";       ask "{\"model\":\"$m\",\"think\":false,$Q}"
            echo "== $m, think true";        ask "{\"model\":\"$m\",\"think\":true,$Q}"
            echo "== $m, think \"low\"";     ask "{\"model\":\"$m\",\"think\":\"low\",$Q}"
            echo "== $m, think \"high\"";    ask "{\"model\":\"$m\",\"think\":\"high\",$Q}"
          done
          echo "== qwen2.5:1.5b (no thinking), think true"; ask "{\"model\":\"qwen2.5:1.5b\",\"think\":true,$Q}"
          echo "== qwen2.5:1.5b (no thinking), think false"; ask "{\"model\":\"qwen2.5:1.5b\",\"think\":false,$Q}"
          echo "== status of think true on a model that does not think:"
          curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:11434/api/chat -d "{\"model\":\"qwen2.5:1.5b\",\"think\":true,$Q}"
      - name: A streamed thinking answer, first lines
        run: |
          curl -s http://127.0.0.1:11434/api/chat -d '{"model":"qwen3:1.7b","think":true,"messages":[{"role":"user","content":"What is 17 times 23?"}],"options":{"num_predict":60}}' | head -c 1500; echo
          echo "== the last line:"
          curl -s http://127.0.0.1:11434/api/chat -d '{"model":"qwen3:1.7b","think":false,"messages":[{"role":"user","content":"Say hi."}],"options":{"num_predict":20}}' | tail -n 1 | head -c 700; echo

  llamacpp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: llama.cpp with a thinking model and with a plain one
        run: |
          build=$(gh api "repos/ggml-org/llama.cpp/releases?per_page=20" --jq '[.[] | select(.tag_name | test("^b[0-9]+$"))][0].tag_name')
          echo "llama.cpp build: $build"
          gh release download "$build" --repo ggml-org/llama.cpp --pattern "llama-$build-bin-ubuntu-x64.tar.gz" --dir llama
          mkdir llama/bin && tar -xzf llama/*.tar.gz -C llama/bin
          server=$(find llama/bin -type f -name llama-server | head -1)
          echo "SERVER=$server" >> $GITHUB_ENV
          curl -sL --fail -o think.gguf https://huggingface.co/Qwen/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q8_0.gguf
          curl -sL --fail -o plain.gguf https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
          ls -la *.gguf
      - name: What the servers say and how they take a request
        run: |
          export LD_LIBRARY_PATH="$(dirname "$SERVER"):$LD_LIBRARY_PATH"
          probe() {
            name=$1; port=$2
            nohup "$SERVER" -m $name.gguf -c 8192 --host 127.0.0.1 --port $port --jinja > $name.log 2>&1 &
            for i in $(seq 1 90); do curl -s -m 2 http://127.0.0.1:$port/health | grep -q ok && break; sleep 2; done
            echo "===== $name: /props (without the template itself)"
            curl -s http://127.0.0.1:$port/props | python3 -c "import sys,json; d=json.load(sys.stdin); d.pop('chat_template', None); d.pop('chat_template_tool_use', None); g=d.get('default_generation_settings',{}); p=g.get('params',{}); d['default_generation_settings']={'n_ctx': g.get('n_ctx'), 'params_reasoning': {k: v for k, v in p.items() if 'reason' in k or 'think' in k}}; print(json.dumps(d)[:1800])"
            ask() { curl -s http://127.0.0.1:$port/v1/chat/completions -d "$1" | python3 -c "import sys,json; d=json.load(sys.stdin); m=(d.get('choices') or [{}])[0].get('message',{}); print(json.dumps({'error': d.get('error'), 'reasoning_content_chars': len(m.get('reasoning_content') or ''), 'content': (m.get('content') or '')[:90], 'has_think_tag': '<think>' in (m.get('content') or '')}))"; }
            Q='"messages":[{"role":"user","content":"What is 17 times 23? Answer with the number."}],"max_tokens":400'
            echo "== nothing about reasoning";                    ask "{$Q}"
            echo "== reasoning_effort none";                      ask "{\"reasoning_effort\":\"none\",$Q}"
            echo "== reasoning_effort low";                       ask "{\"reasoning_effort\":\"low\",$Q}"
            echo "== reasoning_effort high";                      ask "{\"reasoning_effort\":\"high\",$Q}"
            echo "== chat_template_kwargs enable_thinking false"; ask "{\"chat_template_kwargs\":{\"enable_thinking\":false},$Q}"
            echo "== chat_template_kwargs enable_thinking true";  ask "{\"chat_template_kwargs\":{\"enable_thinking\":true},$Q}"
            echo "== streamed, the first pieces:"
            curl -s http://127.0.0.1:$port/v1/chat/completions -d "{\"stream\":true,\"messages\":[{\"role\":\"user\",\"content\":\"What is 17 times 23?\"}],\"max_tokens\":40}" | head -c 900; echo
          }
          probe think 8081
          probe plain 8082
