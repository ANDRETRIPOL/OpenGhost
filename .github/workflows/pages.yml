name: Website

# Publishes the website (site/) to GitHub Pages, with the real app from this repository inside it as the demo.
# It runs when main changes and when a release is published, so the page always shows the latest version
# (release.json) and links straight to its files.
on:
  push:
    branches: [main]
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/app/desktop
          cp site/index.html _site/
          cp -r site/media _site/
          # The app itself, as it is in this commit.
          cp index.html styles.css ./*.js _site/app/
          cp desktop/icon.png desktop/cursor.png _site/app/desktop/
          # The demo layer: loaded before every other script of the app, it answers with replies written in advance.
          cp site/demo/demo.js site/demo/demo-scenarios.js _site/app/
          sed -i 's#<script src="desktop.js"></script>#<script src="demo-scenarios.js"></script>\n  <script src="demo.js"></script>\n  <script src="desktop.js"></script>#' _site/app/index.html
          grep -q 'src="demo.js"' _site/app/index.html
          # Inside the page the message field must not take the focus by itself: it would scroll the website to the demo.
          sed -i 's/ autofocus>/>/' _site/app/index.html
          # The latest release: version, files and notes. The page also asks GitHub itself and falls back to this.
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > _site/release.json || echo '{}' > _site/release.json
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
