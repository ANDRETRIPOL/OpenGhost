<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#101110">
  <title>Page not found · OpenGhost</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'">
  <style>
    html,body{margin:0;min-height:100%;background:#101110;color:#eeeee7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;box-sizing:border-box}
    main{max-width:460px;text-align:left}
    .code{font-size:13px;letter-spacing:.14em;color:#f5a46d;margin:0 0 14px}
    h1{font-weight:500;font-size:34px;letter-spacing:-.8px;margin:0 0 14px;line-height:1.15}
    p{color:#a0a39b;font-size:15px;line-height:1.7;margin:0 0 28px}
    a{display:inline-flex;align-items:center;min-height:44px;padding:10px 18px;border-radius:9px;background:#f5a46d;color:#1c1a17;text-decoration:none;font-size:14px;font-weight:500}
    a:focus-visible{outline:2px solid #f5a46d;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <p class="code">ERROR 404</p>
    <h1>This page has drifted away.</h1>
    <p>The ghost could not find what you asked for. The address may be mistyped, or the page may have moved.</p>
    <a href="./">Back to OpenGhost</a>
  </main>
</body>
</html>
